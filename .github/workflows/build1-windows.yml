
name: Build DJ Music Analyzer Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name DJMusicAnalyzer --collect-all librosa --collect-all soundfile --collect-all sklearn main.py

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: DJMusicAnalyzer-Windows11
          path: dist/DJMusicAnalyzer/
